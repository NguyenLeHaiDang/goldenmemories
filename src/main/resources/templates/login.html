<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Login | Ký Ức Vàng')}"></head>
<body>
<div class="page-shell">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="auth-layout">
        <section class="auth-card">
            <p class="eyebrow">Welcome back</p>
            <h1>Sign in</h1>

            <!-- Success banner after registration+OTP -->
            <div class="alert alert-success" th:if="${registrationSuccess}"
                 th:text="${registrationSuccess}"></div>

            <!-- Error banner from failed login -->
            <div class="alert alert-error" th:if="${loginError}"
                 th:text="${loginError}"></div>

            <!-- Logout confirmation -->
            <div class="alert alert-info" th:if="${logoutMessage}"
                 th:text="${logoutMessage}"></div>

            <form th:action="@{/login}" method="post" th:object="${loginForm}" class="form-stack">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <label>
                    Email
                    <input type="email" th:field="*{email}" placeholder="you@example.com"
                           autocomplete="email" />
                </label>

                <label>
                    Password
                    <input type="password" th:field="*{password}" placeholder="Your password"
                           autocomplete="current-password" />
                </label>

                <button class="button button-primary" type="submit">Sign in</button>
            </form>

            <div class="auth-links">
                <a th:href="@{/register}">Create an account</a>
                <a th:href="@{/otp}">Verify email code</a>
            </div>

            <div class="divider"><span>or continue with</span></div>

            <div class="social-buttons">
                <a class="button button-secondary" href="/oauth2/authorization/google">
                    Google
                </a>
                <a class="button button-secondary" href="/oauth2/authorization/facebook">
                    Facebook
                </a>
            </div>
        </section>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>
