<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Parent Profile | Ký Ức Vàng')}"></head>
<body>
<div class="page-shell">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="auth-layout">
        <section class="auth-card wide">
            <p class="eyebrow">
                <a th:href="@{/dashboard}">Dashboard</a> &rsaquo; Parent profile
            </p>
            <h1 th:text="${hasProfile} ? 'Edit parent profile' : 'Set up parent profile'">Parent profile</h1>
            <p class="lead" style="margin-top: 6px;">
                This is the person whose memories you are preserving. Their Zalo contact is used to send story prompts.
            </p>

            <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

            <form th:action="@{/parent/profile}" method="post"
                  th:object="${parentProfileForm}" class="form-stack">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <label>
                    Parent's full name
                    <input type="text" th:field="*{parentName}" placeholder="e.g. Nguyễn Thị Hoa"
                           th:classappend="${#fields.hasErrors('parentName')} ? 'input-error'" />
                    <span class="field-error" th:if="${#fields.hasErrors('parentName')}"
                          th:errors="*{parentName}"></span>
                </label>

                <label>
                    Relation
                    <input type="text" th:field="*{relation}" placeholder="e.g. Mother, Father, Grandmother"
                           th:classappend="${#fields.hasErrors('relation')} ? 'input-error'" />
                    <span class="field-error" th:if="${#fields.hasErrors('relation')}"
                          th:errors="*{relation}"></span>
                </label>

                <label>
                    Zalo contact
                    <input type="text" th:field="*{zaloContact}" placeholder="Zalo phone number or ID" />
                </label>

                <label>
                    Additional phone
                    <input type="text" th:field="*{additionalPhone}" placeholder="Optional backup number" />
                </label>

                <label>
                    Notes
                    <textarea th:field="*{notes}" rows="4"
                              placeholder="Language preference, health notes, best contact time..."></textarea>
                </label>

                <button class="button button-primary" type="submit">Save profile</button>
            </form>

            <div class="auth-links">
                <a th:href="@{/dashboard}">Back to dashboard</a>
            </div>
        </section>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>
