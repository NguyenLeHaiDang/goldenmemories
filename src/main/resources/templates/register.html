<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Register | Ký Ức Vàng')}"></head>
<body>
<div class="page-shell">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="auth-layout">
        <section class="auth-card">
            <p class="eyebrow">Start a project</p>
            <h1>Create account</h1>

            <form th:action="@{/register}" method="post" th:object="${registerForm}" class="form-stack">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <label>
                    Full name
                    <input type="text" th:field="*{fullName}" placeholder="Your full name"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'input-error'" />
                    <span class="field-error" th:if="${#fields.hasErrors('fullName')}"
                          th:errors="*{fullName}"></span>
                </label>

                <label>
                    Email
                    <input type="email" th:field="*{email}" placeholder="you@example.com"
                           th:classappend="${#fields.hasErrors('email')} ? 'input-error'" />
                    <span class="field-error" th:if="${#fields.hasErrors('email')}"
                          th:errors="*{email}"></span>
                </label>

                <label>
                    Phone
                    <input type="text" th:field="*{phone}" placeholder="Phone number"
                           th:classappend="${#fields.hasErrors('phone')} ? 'input-error'" />
                    <span class="field-error" th:if="${#fields.hasErrors('phone')}"
                          th:errors="*{phone}"></span>
                </label>

                <label>
                    Password
                    <input type="password" th:field="*{password}" placeholder="At least 8 characters"
                           th:classappend="${#fields.hasErrors('password')} ? 'input-error'" />
                    <span class="field-error" th:if="${#fields.hasErrors('password')}"
                          th:errors="*{password}"></span>
                </label>

                <button class="button button-primary" type="submit">Send verification code</button>
            </form>

            <div class="auth-links">
                <a th:href="@{/login}">Already have an account? Sign in</a>
            </div>
        </section>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>
