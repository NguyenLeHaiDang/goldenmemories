<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Contact | Ký Ức Vàng')}"></head>
<body>
<div class="page-shell">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="auth-layout">
        <section class="auth-card wide">
            <p class="eyebrow">Talk to us</p>
            <h1>Request a consultation</h1>
            <form th:action="@{/contact}" method="post" th:object="${contactForm}" class="form-stack">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <label>Full name<input type="text" th:field="*{fullName}" /></label>
                <label>Email<input type="email" th:field="*{email}" /></label>
                <label>Message<textarea th:field="*{message}" rows="5" placeholder="Tell us what you want to build..."></textarea></label>
                <button class="button button-primary" type="submit">Send message</button>
            </form>
        </section>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>
