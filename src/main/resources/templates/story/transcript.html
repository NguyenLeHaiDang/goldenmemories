<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Transcript | Ký Ức Vàng')}"></head>
<body>
<div class="page-shell">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="auth-layout">
        <section class="auth-card wide">
            <p class="eyebrow">
                <a th:href="@{/project/__${project.id}__/story}">Stories</a> &rsaquo; Transcript
            </p>
            <h1>Submit transcript</h1>
            <p class="lead" style="margin-top: 6px;">
                Enter the voice note transcription for this prompt.
            </p>

            <div class="alert alert-info" style="margin-top: 14px;">
                <strong>Prompt:</strong>
                <span th:text="${story.promptQuestion}">question</span>
                &nbsp;·&nbsp;
                <span class="badge" th:text="${story.lifeStage.name().replace('_',' ')}">STAGE</span>
            </div>

            <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

            <form th:action="@{/project/__${project.id}__/story/__${story.id}__/transcript}"
                  method="post" th:object="${transcriptForm}" class="form-stack">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <label>
                    Raw transcript
                    <textarea th:field="*{rawTranscript}" rows="12"
                              placeholder="Type or paste the transcript here..."
                              th:classappend="${#fields.hasErrors('rawTranscript')} ? 'input-error'"></textarea>
                    <span class="field-error" th:if="${#fields.hasErrors('rawTranscript')}"
                          th:errors="*{rawTranscript}"></span>
                </label>

                <button class="button button-primary" type="submit">Save transcript</button>
            </form>

            <div class="auth-links">
                <a th:href="@{/project/__${project.id}__/story}">Back to stories</a>
            </div>
        </section>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</div>
</body>
</html>
