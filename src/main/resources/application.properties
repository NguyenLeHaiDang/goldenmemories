spring.application.name=goldenmemoriesweb
spring.thymeleaf.cache=false

# ── H2 in-process database (dev) ─────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:goldenmemdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Google OAuth2 ─────────────────────────────────────────────────────────────
# Falls back to 'disabled' so the app starts without credentials.
# Social login buttons will not work until real values are provided.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.client-name=Google
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ── Facebook OAuth2 ───────────────────────────────────────────────────────────
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.client-name=Facebook
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v20.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v20.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email,picture
spring.security.oauth2.client.provider.facebook.user-name-attribute=id

# ── Gmail SMTP for OTP mail ───────────────────────────────────────────────────
# Falls back to safe no-op values — app boots, OTP emails just won't send.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=danglehainguyen@gmail.com
spring.mail.password=nvzuqcapipznmiep
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

